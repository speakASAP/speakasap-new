---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speakasap-assessment
  namespace: statex-apps
  labels:
    app: speakasap-assessment
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speakasap-assessment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: speakasap-assessment
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z db-server-postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: app
          image: localhost:5000/speakasap-assessment:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4203
              name: http
          # LOGGING_SERVICE_TOKEN comes from this service's ExternalSecret
          # (per-pair RS256). Do not reintroduce logging-ingest-credentials —
          # that shared static non-JWT floods Auth with alg=none rejects.
          envFrom:
            - configMapRef:
                name: speakasap-assessment-config
            - secretRef:
                name: speakasap-assessment-secret
          startupProbe:
            httpGet:
              path: /health
              port: 4203
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4203
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 4203
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: speakasap-assessment
  namespace: statex-apps
  labels:
    app: speakasap-assessment
    managed-by: k8s-migration
spec:
  type: ClusterIP
  selector:
    app: speakasap-assessment
  ports:
    - protocol: TCP
      port: 4203
      targetPort: 4203
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: speakasap-assessment-config
  namespace: statex-apps
  labels:
    app: speakasap-assessment
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "speakasap-assessment"
  PORT: "4203"
  DB_HOST: "db-server-postgres"
  DB_PORT: "5432"
  DB_USER: "speakasap_assessment"
  DB_NAME: "speakasap_assessment_db"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"
  REDIS_HOST: "db-server-redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  LOGGING_SERVICE_URL: "http://logging-microservice:3367"
  LOGGING_SERVICE_API_PATH: "/api/logs"
  LOGGING_SERVICE_TIMEOUT: "5000"
  AUTH_SERVICE_URL: "http://auth-microservice:3370"
  AUTH_SERVICE_TIMEOUT: "5000"
  AUTH_RETRY_MAX_ATTEMPTS: "3"
  AUTH_RETRY_DELAY_MS: "1000"
  USER_SERVICE_URL: "http://speakasap-user:4207"
  COURSE_SERVICE_URL: "http://speakasap-course:4205"
  CONTENT_SERVICE_URL: "http://speakasap-content:4201"
  AI_SERVICE_URL: "http://ai-microservice:3380"
  AI_SERVICE_TIMEOUT: "5000"
  AI_SERVICE_TRANSLATE_PATH: "/api/v1/translate"
  NOTIFICATION_SERVICE_URL: "http://speakasap-notification:4209"
  NOTIFICATION_SERVICE_TIMEOUT: "5000"
  HTTP_TIMEOUT: "30000"
  GATEWAY_TIMEOUT: "60000"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_DELAY_MS: "1000"
  DEFAULT_PAGE_SIZE: "10"
  MAX_PAGE_SIZE: "30"
  ASSETS_BASE_URL: "https://assets.alfares.cz"
  FRONTEND_URL: "https://speakasap.alfares.cz"
  CORS_ORIGIN: "https://speakasap.alfares.cz"
  LANGUAGE_TEST_LANDING_BASE_URL: "https://speakasap.com"
  ASSESSMENT_SERVICE_PUBLIC_BASE_URL: "https://speakasap.alfares.cz"
  USER_TEST_ASSETS_DIR: "/app/assets"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speakasap-assessment-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: speakasap-assessment-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/speakasap
        property: DB_PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/speakasap/assessment
        property: DATABASE_URL
    - secretKey: ASSESSMENT_VIEW_TOKEN_SECRET
      remoteRef:
        key: secret/prod/speakasap/assessment
        property: ASSESSMENT_VIEW_TOKEN_SECRET
    # Per-pair RS256 ingest: svc-<deploy>--logging-microservice@internal.alfares.cz
    # role internal:logging-microservice:ingest.
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/speakasap/assessment
        property: LOGGING_SERVICE_TOKEN
