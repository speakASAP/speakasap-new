---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speakasap-salary
  namespace: statex-apps
  labels:
    app: speakasap-salary
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speakasap-salary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: speakasap-salary
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z db-server-postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: app
          image: localhost:5000/speakasap-salary:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4212
              name: http
          # LOGGING_SERVICE_TOKEN comes from this service's ExternalSecret
          # (per-pair RS256). Do not reintroduce logging-ingest-credentials —
          # that shared static non-JWT floods Auth with alg=none rejects.
          envFrom:
            - configMapRef:
                name: speakasap-salary-config
            - secretRef:
                name: speakasap-salary-secret
          startupProbe:
            httpGet:
              path: /health
              port: 4212
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4212
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 4212
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: speakasap-salary
  namespace: statex-apps
  labels:
    app: speakasap-salary
    managed-by: k8s-migration
spec:
  type: ClusterIP
  selector:
    app: speakasap-salary
  ports:
    - protocol: TCP
      port: 4212
      targetPort: 4212
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: speakasap-salary-config
  namespace: statex-apps
  labels:
    app: speakasap-salary
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "speakasap-salary"
  PORT: "4212"
  SALARY_SERVICE_PORT: "4212"
  DB_HOST: "db-server-postgres"
  DB_PORT: "5432"
  DB_USER: "speakasap_salary"
  DB_NAME: "speakasap_salary_db"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"
  REDIS_HOST: "db-server-redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  LOGGING_SERVICE_URL: "http://logging-microservice:3367"
  LOGGING_SERVICE_API_PATH: "/api/logs"
  LOGGING_SERVICE_TIMEOUT: "5000"
  AUTH_SERVICE_URL: "http://auth-microservice:3370"
  AUTH_SERVICE_TIMEOUT: "5000"
  AUTH_RETRY_MAX_ATTEMPTS: "3"
  AUTH_RETRY_DELAY_MS: "1000"
  USER_SERVICE_URL: "http://speakasap-user:4207"
  PAYMENT_SERVICE_URL: "http://speakasap-payment:4208"
  # Where the lesson hours every payout is computed from come from. Without this,
  # EducationClientService takes its unconfigured branch and returns zero aggregates
  # with salaryCalculationReady=false, so no calculation run can ever succeed.
  EDUCATION_SERVICE_URL: "http://speakasap-education:4206"
  NOTIFICATION_SERVICE_URL: "http://speakasap-notification:4209"
  NOTIFICATION_SERVICE_TIMEOUT: "5000"
  HTTP_TIMEOUT: "30000"
  GATEWAY_TIMEOUT: "60000"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_DELAY_MS: "1000"
  DEFAULT_PAGE_SIZE: "10"
  MAX_PAGE_SIZE: "30"
  ASSETS_BASE_URL: "https://assets.alfares.cz"
  FRONTEND_URL: "https://speakasap.alfares.cz"
  CORS_ORIGIN: "https://speakasap.alfares.cz"
  # Write gate for POST /calculation-runs. Enabled 2026-08-22 to create the 2026-07
  # draft run; the endpoint 412s without it. Creating a run writes calculation_runs +
  # calculation_lines as status=draft only — it moves no money. Disbursement is a
  # separate gate (SALARY_PAYOUT_FLOWS_ENABLED), deliberately left unset.
  SALARY_CALCULATION_RUNS_ENABLED: "true"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speakasap-salary-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: speakasap-salary-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/speakasap
        property: DB_PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/speakasap/salary
        property: DATABASE_URL
    - secretKey: SALARY_DATABASE_URL
      remoteRef:
        key: secret/prod/speakasap/salary
        property: SALARY_DATABASE_URL
    # Auth RS256 pair JWT: svc-salary-service--payment-service → internal:payment-service:internal
    - secretKey: SALARY_TO_PAYMENT_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/speakasap/salary
        property: SALARY_TO_PAYMENT_SERVICE_TOKEN
    # education-service validates the salary aggregates endpoint against its OWN
    # Auth RS256 pair JWT for education InternalAuthGuard
    # (SALARY_TO_EDUCATION_SERVICE_TOKEN → internal:education-service:internal).
    - secretKey: SALARY_TO_EDUCATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/speakasap/salary
        property: SALARY_TO_EDUCATION_SERVICE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/speakasap/salary
        property: LOGGING_SERVICE_TOKEN
