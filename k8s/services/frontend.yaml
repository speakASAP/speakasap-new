---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speakasap-frontend
  namespace: statex-apps
  labels:
    app: speakasap-frontend
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speakasap-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: speakasap-frontend
    spec:
      containers:
        - name: app
          image: localhost:5000/speakasap-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4211
              name: http
          envFrom:
            - configMapRef:
                name: speakasap-frontend-config
            # Server-side only. Next.js exposes NEXT_PUBLIC_* to the browser bundle and
            # nothing else, so these stay on the server — which is why SSO token
            # verification lives in a route handler rather than in client code.
            - secretRef:
                name: speakasap-frontend-secret
          startupProbe:
            httpGet:
              path: /
              port: 4211
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 4211
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 4211
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: speakasap-frontend
  namespace: statex-apps
  labels:
    app: speakasap-frontend
    managed-by: k8s-migration
spec:
  type: ClusterIP
  selector:
    app: speakasap-frontend
  ports:
    - protocol: TCP
      port: 4211
      targetPort: 4211
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: speakasap-frontend-config
  namespace: statex-apps
  labels:
    app: speakasap-frontend
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "speakasap-frontend"
  PORT: "4211"
  NEXT_PUBLIC_API_URL: "https://speakasap.alfares.cz"
---
# Server-side secrets for the legacy SSO handoff (Track I).
#
# This is the first secret this deployment has ever had: it was a purely public-config
# service until the handoff needed to verify a portal-signed token and call auth's
# internal API, neither of which a browser may do.
#
# `x-service-name` is hardcoded to `speakasap-frontend` in the code rather than read from
# SERVICE_NAME above, because auth's TRUSTED_INTERNAL_SERVICES allowlist is keyed on that
# value. Finding 4 was exactly this mismatch, and it surfaces as a 401 that reads like a
# bad token. SERVICE_NAME now carries the same string (it was "frontend", which collided
# with catalog-frontend/allegro-frontend in the log store), but the two remain independent:
# keep the header hardcoded so a SERVICE_NAME change can never silently break auth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speakasap-frontend-secret
  namespace: statex-apps
  labels:
    app: speakasap-frontend
    managed-by: k8s-migration
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: speakasap-frontend-secret
    creationPolicy: Owner
  data:
    # Must equal the portal's own value, or every handoff token fails signature checks.
    - secretKey: SPEAKASAP_PLATFORM_JWT_SECRET
      remoteRef:
        key: secret/prod/speakasap-frontend
        property: SPEAKASAP_PLATFORM_JWT_SECRET
    # Must equal auth-microservice's static secret while the migration window is
    # open. Prefer AUTH_SERVICE_TOKEN (RS256) once provisioned.
    # Principal: svc-speakasap-frontend--auth-microservice@internal.alfares.cz
    # role internal:auth-microservice:sso-handoff
    - secretKey: AUTH_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/speakasap-frontend
        property: AUTH_SERVICE_TOKEN
    - secretKey: INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/speakasap-frontend
        property: INTERNAL_SERVICE_TOKEN
    - secretKey: AUTH_SERVICE_URL
      remoteRef:
        key: secret/prod/speakasap-frontend
        property: AUTH_SERVICE_URL
