---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speakasap-education
  namespace: statex-apps
  labels:
    app: speakasap-education
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speakasap-education
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: speakasap-education
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z db-server-postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: app
          image: localhost:5000/speakasap-education:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4206
              name: http
          # LOGGING_SERVICE_TOKEN comes from this service's ExternalSecret
          # (per-pair RS256). Do not reintroduce logging-ingest-credentials —
          # that shared static non-JWT floods Auth with alg=none rejects.
          envFrom:
            - configMapRef:
                name: speakasap-education-config
            - secretRef:
                name: speakasap-education-secret
          startupProbe:
            httpGet:
              path: /health
              port: 4206
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4206
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 4206
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: speakasap-education
  namespace: statex-apps
  labels:
    app: speakasap-education
    managed-by: k8s-migration
spec:
  type: ClusterIP
  selector:
    app: speakasap-education
  ports:
    - protocol: TCP
      port: 4206
      targetPort: 4206
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: speakasap-education-config
  namespace: statex-apps
  labels:
    app: speakasap-education
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "speakasap-education"
  PORT: "4206"
  DB_HOST: "db-server-postgres"
  DB_PORT: "5432"
  DB_USER: "speakasap_education"
  DB_NAME: "speakasap_education_db"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"
  REDIS_HOST: "db-server-redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  LOGGING_SERVICE_URL: "http://logging-microservice:3367"
  LOGGING_SERVICE_API_PATH: "/api/logs"
  LOGGING_SERVICE_TIMEOUT: "5000"
  AUTH_SERVICE_URL: "http://auth-microservice:3370"
  AUTH_SERVICE_TIMEOUT: "5000"
  AUTH_RETRY_MAX_ATTEMPTS: "3"
  AUTH_RETRY_DELAY_MS: "1000"
  # LESSON-API: transitional — delete at legacy sunset.
  # The portal owns lessons; this service holds no lesson tables. Public URL, not a
  # cluster one: the portal runs on the speakasap host, outside this cluster.
  # PORTAL_INBOUND_API_TOKEN is the matching secret, injected via ExternalSecret below.
  PORTAL_API_URL: "https://speakasap.com/api/v1/internal"
  PORTAL_CLIENT_TIMEOUT_MS: "5000"
  CONTENT_SERVICE_URL: "http://speakasap-content:4201"
  COURSE_SERVICE_URL: "http://speakasap-course:4205"
  USER_SERVICE_URL: "http://speakasap-user:4207"
  ASSESSMENT_SERVICE_URL: "http://speakasap-assessment:4203"
  AI_SERVICE_URL: "http://ai-microservice:3380"
  DRILL_GENERATION_MODEL_TIER: "smart"
  DRILL_GENERATION_TIMEOUT_SECONDS: "600"
  AI_SERVICE_TIMEOUT: "5000"
  AI_SERVICE_TRANSLATE_PATH: "/api/v1/translate"
  NOTIFICATION_SERVICE_URL: "http://speakasap-notification:4209"
  NOTIFICATION_SERVICE_TIMEOUT: "5000"
  NOTIFICATION_RETRY_MAX_ATTEMPTS: "3"
  NOTIFICATION_RETRY_DELAY_MS: "1000"
  HTTP_TIMEOUT: "30000"
  GATEWAY_TIMEOUT: "60000"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_DELAY_MS: "1000"
  DEFAULT_PAGE_SIZE: "10"
  MAX_PAGE_SIZE: "30"
  ASSETS_BASE_URL: "https://assets.alfares.cz"
  FRONTEND_URL: "https://speakasap.alfares.cz"
  CORS_ORIGIN: "https://speakasap.alfares.cz"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speakasap-education-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: speakasap-education-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/speakasap
        property: DB_PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/speakasap/education
        property: DATABASE_URL
    - secretKey: INTERNAL_API_TOKEN
      remoteRef:
        key: secret/prod/speakasap/education
        property: INTERNAL_API_TOKEN
    # ai-microservice's ServiceAuthGuard verifies an HS256 service JWT signed
    # with ITS OWN JWT_SECRET, so this reads from ai-microservice's Vault path
    # rather than speakasap's. Without it, AiClient cannot mint a token the
    # generator accepts and every drill generation fails with 401.
    - secretKey: AI_SERVICE_JWT_SECRET
      remoteRef:
        key: secret/prod/ai-microservice
        property: JWT_SECRET
    # auth-microservice's InternalServiceGuard checks `x-internal-service-token`
    # against ITS OWN INTERNAL_SERVICE_TOKEN, so this reads from auth's Vault
    # path. Distinct from INTERNAL_API_TOKEN above, which is the api-gateway's
    # convention for content-service — the two are not interchangeable, and
    # sending the wrong one 401s every student-name lookup.
    - secretKey: INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: INTERNAL_SERVICE_TOKEN
    - secretKey: LESSON_RECORD_MEDIA_TOKEN_SECRET
      remoteRef:
        key: secret/prod/speakasap/education
        property: LESSON_RECORD_MEDIA_TOKEN_SECRET
    # LESSON-API: transitional — delete at legacy sunset.
    # Presented as x-internal-token to the portal's /api/v1/internal/ endpoints. The SAME
    # value must be set as PORTAL_INBOUND_API_TOKEN in the portal's own .env on the
    # speakasap host, which does not read Vault. Both sides fail closed when it is unset:
    # the portal denies every request, and LessonClientService raises rather than
    # returning an empty roster. See docs/LESSON_API_OPERATIONS.md.
    - secretKey: PORTAL_INBOUND_API_TOKEN
      remoteRef:
        key: secret/prod/speakasap/education
        property: PORTAL_INBOUND_API_TOKEN
    - secretKey: RECORDS_S3_ENDPOINT_URL
      remoteRef:
        key: secret/prod/speakasap/education
        property: RECORDS_S3_ENDPOINT_URL
    - secretKey: RECORDS_S3_BUCKET
      remoteRef:
        key: secret/prod/speakasap/education
        property: RECORDS_S3_BUCKET
    - secretKey: RECORDS_S3_ACCESS_KEY
      remoteRef:
        key: secret/prod/speakasap/education
        property: RECORDS_S3_ACCESS_KEY
    - secretKey: RECORDS_S3_SECRET_KEY
      remoteRef:
        key: secret/prod/minio-microservice
        property: MINIO_ROOT_PASSWORD
    - secretKey: RECORDS_S3_REGION_NAME
      remoteRef:
        key: secret/prod/speakasap/education
        property: RECORDS_S3_REGION_NAME
    - secretKey: RECORDS_S3_VERIFY_SSL
      remoteRef:
        key: secret/prod/speakasap/education
        property: RECORDS_S3_VERIFY_SSL
    - secretKey: RECORDS_S3_HELPER_URL
      remoteRef:
        key: secret/prod/speakasap/education
        property: RECORDS_S3_HELPER_URL
    # Per-pair RS256 ingest: svc-<deploy>--logging-microservice@internal.alfares.cz
    # role internal:logging-microservice:ingest.
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/speakasap/education
        property: LOGGING_SERVICE_TOKEN
