apiVersion: apps/v1
kind: Deployment
metadata:
  name: speakasap
  namespace: statex-apps
  labels:
    app: speakasap
    managed-by: k8s-migration
spec:
  # Scaled out: this pod is a second copy of api-gateway with SERVICE_NAME=speakasap
  # and no ingest credential. Ingress and clients use speakasap-api-gateway:4210.
  # It was POSTing unauthenticated logs (log_ingest_rejected missing_credential)
  # and keeping LogIngestStale firing against leftover PVC files.
  replicas: 0
  selector:
    matchLabels:
      app: speakasap
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: speakasap
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z db-server-postgres 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-auth
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z auth-microservice 3370; do echo waiting for auth; sleep 2; done']
      containers:
        - name: app
          image: localhost:5000/speakasap:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: speakasap-config
            - secretRef:
                name: speakasap-secret
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
