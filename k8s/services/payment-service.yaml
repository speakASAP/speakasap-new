---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speakasap-payment
  namespace: statex-apps
  labels:
    app: speakasap-payment
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speakasap-payment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: speakasap-payment
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z db-server-postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: app
          image: localhost:5000/speakasap-payment:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4208
              name: http
          # LOGGING_SERVICE_TOKEN comes from this service's ExternalSecret
          # (per-pair RS256). Do not reintroduce logging-ingest-credentials —
          # that shared static non-JWT floods Auth with alg=none rejects.
          envFrom:
            - configMapRef:
                name: speakasap-payment-config
            - secretRef:
                name: speakasap-payment-secret
          startupProbe:
            httpGet:
              path: /health
              port: 4208
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4208
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 4208
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: speakasap-payment
  namespace: statex-apps
  labels:
    app: speakasap-payment
    managed-by: k8s-migration
spec:
  type: ClusterIP
  selector:
    app: speakasap-payment
  ports:
    - protocol: TCP
      port: 4208
      targetPort: 4208
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: speakasap-payment-config
  namespace: statex-apps
  labels:
    app: speakasap-payment
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "speakasap-payment"
  PORT: "4208"
  PAYMENT_SERVICE_PORT: "4208"
  DB_HOST: "db-server-postgres"
  DB_PORT: "5432"
  DB_USER: "speakasap_payment"
  DB_NAME: "speakasap_payment_db"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"
  REDIS_HOST: "db-server-redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  LOGGING_SERVICE_URL: "http://logging-microservice:3367"
  LOGGING_SERVICE_API_PATH: "/api/logs"
  LOGGING_SERVICE_TIMEOUT: "5000"
  AUTH_SERVICE_URL: "http://auth-microservice:3370"
  AUTH_SERVICE_TIMEOUT: "5000"
  AUTH_RETRY_MAX_ATTEMPTS: "3"
  AUTH_RETRY_DELAY_MS: "1000"
  PAYMENTS_MICROSERVICE_URL: "http://payments-microservice:3468"
  NOTIFICATION_SERVICE_URL: "http://speakasap-notification:4209"
  NOTIFICATION_SERVICE_TIMEOUT: "5000"
  NOTIFICATION_RETRY_MAX_ATTEMPTS: "3"
  NOTIFICATION_RETRY_DELAY_MS: "1000"
  PAYMENT_APPLICATION_ID: "speakasap"
  PAYMENT_CALLBACK_URL: "https://speakasap.alfares.cz/api/webhooks/payment-result"
  PAYMENT_SUCCESS_URL: "https://speakasap.alfares.cz/payment-result?status=completed"
  PAYMENT_CANCEL_URL: "https://speakasap.alfares.cz/payment-result?status=cancelled"
  HTTP_TIMEOUT: "30000"
  GATEWAY_TIMEOUT: "60000"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_DELAY_MS: "1000"
  DEFAULT_PAGE_SIZE: "10"
  MAX_PAGE_SIZE: "30"
  ASSETS_BASE_URL: "https://assets.alfares.cz"
  FRONTEND_URL: "https://speakasap.alfares.cz"
  CORS_ORIGIN: "https://speakasap.alfares.cz"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speakasap-payment-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: speakasap-payment-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/speakasap
        property: DB_PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/speakasap/payment
        property: DATABASE_URL
    - secretKey: PAYMENT_DATABASE_URL
      remoteRef:
        key: secret/prod/speakasap/payment
        property: PAYMENT_DATABASE_URL
    - secretKey: PAYMENTS_CHECKOUT_CALLBACK_URL
      remoteRef:
        key: secret/prod/speakasap/payment
        property: PAYMENTS_CHECKOUT_CALLBACK_URL
    - secretKey: PAYMENTS_WEBHOOK_SHARED_SECRET
      remoteRef:
        key: secret/prod/speakasap/payment
        property: PAYMENTS_WEBHOOK_SHARED_SECRET
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: secret/prod/speakasap
        property: PAYMENT_API_KEY
    - secretKey: PAYMENT_WEBHOOK_API_KEY
      remoteRef:
        key: secret/prod/speakasap
        property: PAYMENT_WEBHOOK_API_KEY
    - secretKey: PAYMENTS_MICROSERVICE_API_KEY
      remoteRef:
        key: secret/prod/speakasap
        property: PAYMENTS_MICROSERVICE_API_KEY
    # Per-pair RS256 ingest: svc-<deploy>--logging-microservice@internal.alfares.cz
    # role internal:logging-microservice:ingest.
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/speakasap/payment
        property: LOGGING_SERVICE_TOKEN
