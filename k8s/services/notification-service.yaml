---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speakasap-notification
  namespace: statex-apps
  labels:
    app: speakasap-notification
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speakasap-notification
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: speakasap-notification
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z db-server-postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: app
          image: localhost:5000/speakasap-notification:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4209
              name: http
          # LOGGING_SERVICE_TOKEN comes from this service's ExternalSecret
          # (per-pair RS256). Do not reintroduce logging-ingest-credentials —
          # that shared static non-JWT floods Auth with alg=none rejects.
          envFrom:
            - configMapRef:
                name: speakasap-notification-config
            - secretRef:
                name: speakasap-notification-secret
          startupProbe:
            httpGet:
              path: /health
              port: 4209
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4209
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 4209
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: speakasap-notification
  namespace: statex-apps
  labels:
    app: speakasap-notification
    managed-by: k8s-migration
spec:
  type: ClusterIP
  selector:
    app: speakasap-notification
  ports:
    - protocol: TCP
      port: 4209
      targetPort: 4209
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: speakasap-notification-config
  namespace: statex-apps
  labels:
    app: speakasap-notification
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "speakasap-notification"
  PORT: "4209"
  NOTIFICATION_SERVICE_PORT: "4209"
  NOTIFICATION_SERVICE_URL: "http://speakasap-notification:4209"
  # UserLookupService resolves a dispatch userId to an email address against
  # user-service. Without it every dispatch 400s with "Configure USER_SERVICE_URL
  # and NOTIFICATION_TO_USER_SERVICE_TOKEN to resolve userId to email", regardless of auth.
  USER_SERVICE_URL: "http://speakasap-user:4207"
  # Delivery upstream — notifications-microservice, a DIFFERENT service from this
  DB_HOST: "db-server-postgres"
  DB_PORT: "5432"
  DB_USER: "speakasap_notification"
  DB_NAME: "speakasap_notification_db"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"
  REDIS_HOST: "db-server-redis"
  REDIS_PORT: "6379"
  LOG_LEVEL: "info"
  LOGGING_SERVICE_URL: "http://logging-microservice:3367"
  LOGGING_SERVICE_API_PATH: "/api/logs"
  LOGGING_SERVICE_TIMEOUT: "5000"
  AUTH_SERVICE_URL: "http://auth-microservice:3370"
  AUTH_SERVICE_TIMEOUT: "5000"
  AUTH_RETRY_MAX_ATTEMPTS: "3"
  AUTH_RETRY_DELAY_MS: "1000"
  # Delivery upstream — notifications-microservice, a DIFFERENT service from this
  # one despite the near-identical name. NOT NOTIFICATION_SERVICE_URL above, which
  # points at this service: the transport used to read that one and POSTed mail to
  # itself, 404ing every send.
  NOTIFICATIONS_MICROSERVICE_URL: "http://notifications-microservice:3368"
  HTTP_TIMEOUT: "30000"
  GATEWAY_TIMEOUT: "60000"
  RETRY_MAX_ATTEMPTS: "3"
  RETRY_DELAY_MS: "1000"
  DEFAULT_PAGE_SIZE: "10"
  MAX_PAGE_SIZE: "30"
  ASSETS_BASE_URL: "https://assets.alfares.cz"
  FRONTEND_URL: "https://speakasap.alfares.cz"
  CORS_ORIGIN: "https://speakasap.alfares.cz"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speakasap-notification-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: speakasap-notification-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/speakasap
        property: DB_PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/speakasap/notification
        property: DATABASE_URL
    - secretKey: NOTIFICATION_DATABASE_URL
      remoteRef:
        key: secret/prod/speakasap/notification
        property: NOTIFICATION_DATABASE_URL
    # Auth RS256 pair JWT for user-service InternalAuthGuard
    # (NOTIFICATION_TO_USER_SERVICE_TOKEN → internal:user-service:internal).
    - secretKey: NOTIFICATION_TO_USER_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/speakasap/notification
        property: NOTIFICATION_TO_USER_SERVICE_TOKEN
    # Bearer token for notifications-microservice's JwtRolesGuard. Single source of
    # truth: notifications-microservice reads this very same Vault key as
    # SPEAKASAP_NOTIFICATIONS_SERVICE_TOKEN, matching how cliplot and invoices are
    # wired. One copy, so the two sides cannot drift apart into silent 401s.
    - secretKey: NOTIFICATIONS_MS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/speakasap/notification
        property: NOTIFICATIONS_SERVICE_TOKEN
    # Per-pair RS256 ingest: svc-<deploy>--logging-microservice@internal.alfares.cz
    # role internal:logging-microservice:ingest.
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/speakasap/notification
        property: LOGGING_SERVICE_TOKEN
